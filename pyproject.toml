[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harbour-sailconnect"
version = "0.1.0"
description = "SailfishOS phone screen CarPlay source over LAN"
requires-python = ">=3.7"
license = {text = "GPL-3.0-or-later"}

[tool.setuptools]
packages = ["sailconnect", "carplay_proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
